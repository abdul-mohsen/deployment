name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily — CVE feeds update constantly.
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: dashboard/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan dashboard
        working-directory: dashboard
        # -show=verbose surfaces the exact call site + module version, not
        # just the module list. Exit code is non-zero when a REACHABLE
        # vulnerability is found; unreachable ones are informational.
        run: govulncheck -show=verbose ./...
