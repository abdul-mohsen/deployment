{{define "content"}}
<div class="page-header">
  <div class="page-header-left">
    <h1 class="page-title">Deployment Commands</h1>
    <span class="page-subtitle">Every action maps to <code>scripts/deployctl.sh</code></span>
  </div>
  <div class="page-header-right">
    <a href="/releases" class="btn btn-secondary">Releases</a>
    <a href="/scripts/status" class="btn btn-primary">Run status</a>
  </div>
</div>

<div class="command-grid">
  {{range .Scripts}}
  <a href="/scripts/{{.Slug}}" class="command-card">
    <div class="cc-top">
      <span class="cc-group">{{.Group}}</span>
      {{if .Danger}}<span class="cc-danger">danger</span>{{end}}
    </div>
    <div class="cc-title">{{.Title}}</div>
    <div class="cc-desc">{{.Summary}}</div>
    <code class="cc-cmd">deployctl {{.ControlCommand}}</code>
  </a>
  {{end}}
</div>
{{end}}

{{define "scripts.html"}}{{template "_layout.html" .}}{{end}}
