name: gosec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: dashboard/go.sum
      - name: Run gosec
        uses: securego/gosec@master
        with:
          # Emit SARIF so findings appear in the GitHub Security tab.
          # -exclude-dir=vendor keeps upstream noise out.
          # Confidence + severity thresholds trimmed to MEDIUM so we do not
          # drown in G104 "unhandled error" noise on a repo that already
          # has _ = ... intentional swallow patterns.
          args: '-fmt sarif -out gosec.sarif -exclude-dir=dashboard/vendor -severity medium -confidence medium ./dashboard/...'
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
