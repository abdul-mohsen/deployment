apiVersion: 1

providers:
  - name: Ifritah operator dashboards
    orgId: 1
    folder: Ifritah Operations
    folderUid: ifritah-operations
    type: file
    disableDeletion: true
    editable: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards-json
      foldersFromFilesStructure: false
