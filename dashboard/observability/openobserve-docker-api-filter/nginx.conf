events {}

http {
  upstream docker_api_openobserve {
    server docker-socket-proxy-openobserve:2375;
  }

  server {
    listen 2375;
    server_name _;
    access_log off;

    # The OpenObserve profile has a separate read-only Docker boundary. The
    # exporter and Alloy can discover, tail, inspect, and sample stats only.
    if ($request_method != GET) {
      return 403;
    }

    proxy_http_version 1.0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_set_header Host docker-socket-proxy-openobserve:2375;
    proxy_set_header Connection "close";

    location ~ ^/(v[0-9]+(?:\.[0-9]+)?/)?(?:_ping|version)$ {
      proxy_pass http://docker_api_openobserve;
    }

    location ~ ^/(v[0-9]+(?:\.[0-9]+)?/)?containers/json$ {
      proxy_pass http://docker_api_openobserve;
    }

    location ~ ^/(v[0-9]+(?:\.[0-9]+)?/)?containers/[A-Za-z0-9_.-]+/logs$ {
      proxy_pass http://docker_api_openobserve;
    }

    location ~ ^/(v[0-9]+(?:\.[0-9]+)?/)?containers/[A-Za-z0-9_.-]+/(?:json|stats)$ {
      proxy_pass http://docker_api_openobserve;
    }

    # Alloy discovery reads the network list to compute per-container
    # network labels. Network inspection remains GET-only and ID-scoped.
    location ~ ^/(v[0-9]+(?:\.[0-9]+)?/)?networks(?:/[A-Za-z0-9_.-]+)?$ {
      proxy_pass http://docker_api_openobserve;
    }

    location / {
      return 403;
    }
  }
}
