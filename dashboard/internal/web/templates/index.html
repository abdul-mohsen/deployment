{{define "content"}}
<section class="ops-hero">
  <div>
    <div class="eyebrow">applications</div>
    <h1>Tenant Fleet</h1>
    <p>Base domain <code>*.{{.Base}}</code></p>
  </div>
  <div id="metrics" class="metric-strip">
    <span>Tenants <b id="m-total">.</b></span>
    <span class="metric-ok">Healthy <b id="m-running">.</b></span>
    <span class="metric-warn">Degraded <b id="m-degraded">.</b></span>
    <span class="metric-bad">Down <b id="m-down">.</b></span>
    <span id="dokku-pill">Dokku <b>...</b></span>
  </div>
</section>

<div class="ops-toolbar">
  <input id="filter" placeholder="Filter tenants" autocomplete="off" class="control-input">
  <a href="/scripts/create-tenant" class="command-link">New tenant</a>
  <a href="/scripts/deploy-all" class="command-link">Sync image</a>
  <a href="/scripts/status" class="command-link secondary">Full status</a>
  <span id="pulse" class="pulse-dot opacity-0"></span>
</div>

<div id="grid" class="app-grid">
  <div class="skel skeleton-card animate-pulse"></div>
  <div class="skel skeleton-card animate-pulse"></div>
  <div class="skel skeleton-card animate-pulse"></div>
</div>

<template id="card-tpl">
  <a class="app-card group">
    <div class="card-topline"></div>
    <div class="card-head">
      <div class="tenant-title">
        <span class="js-ring status-orbit">
          <span class="js-ping status-ping"></span>
          <span class="js-dot status-dot"></span>
        </span>
        <div class="min-w-0">
          <h3 class="js-name">tenant-name</h3>
          <div class="js-domain endpoint">domain</div>
        </div>
      </div>
      <div class="badge-stack">
        <span class="js-health status-badge">health</span>
        <span class="js-sync status-badge">sync</span>
      </div>
    </div>
    <div class="state-matrix">
      <div><span>Live</span><b class="js-live">.</b></div>
      <div><span>Desired</span><b class="js-desired">.</b></div>
      <div><span>Backend</span><b class="js-backend">.</b></div>
      <div><span>Frontend</span><b class="js-frontend">.</b></div>
    </div>
    <div class="resource-line">
      <span class="js-state state-chip">state</span>
      <span class="js-version truncate">.</span>
      <span class="js-apps truncate">.</span>
    </div>
    <div class="card-actions">
      <button data-act="restart" class="act action-chip">restart</button>
      <button data-act="stop" class="act action-chip warn">stop</button>
      <button data-act="start" class="act action-chip good">start</button>
      <span class="drill-in">open</span>
    </div>
  </a>
</template>
{{end}}

{{define "index.html"}}{{template "_layout.html" .}}{{end}}
