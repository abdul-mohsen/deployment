global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape only services on the private observability network. No tenant
  # application endpoints or host interfaces are exposed by this profile.
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
