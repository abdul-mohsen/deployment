name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan even without a push, so new CodeQL rules catch old code.
    - cron: '32 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript]
    steps:
      - uses: actions/checkout@v4

      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: dashboard/go.sum

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-extended = higher-recall query pack; security-and-quality
          # is even louder but noisy for a small repo. Start with -extended.
          queries: security-extended

      # Autobuild for Go compiles the module before analysis. It picks up
      # dashboard/go.mod automatically.
      - if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
