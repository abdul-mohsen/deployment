# Optional ZATCA daemon overlay.
#
# Start explicitly after setting the operator-owned values in config.env:
#   docker compose --env-file ../config.env \
#     -f docker-compose.zatca.yml --profile zatca up -d zatca-daemon
#
# The daemon image contains the Go worker, Java runtime, and approved Fatoora
# SDK artifact. This deployment repository only consumes that image.
services:
  zatca-daemon:
    profiles: ["zatca"]
    image: ${ZATCA_DAEMON_IMAGE:?ZATCA_DAEMON_IMAGE must be set}
    container_name: ${ZATCA_DAEMON_CONTAINER:-zatca-daemon}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Tenant containers reach the daemon through host.docker.internal.
      - "${NATS_PORT:-4222}:4222"
      # Keep the authenticated monitor local to the deployment host.
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - "${ZATCA_XML_ROOT:-/opt/zatca-xml}:/data/zatca-xml"
      - "${ZATCA_NATS_DATA_ROOT:-/opt/zatca-nats}:/data/nats"
    environment:
      # Shared deployment MySQL location and daemon-scoped credentials.
      DB_USER: ${ZATCA_DB_USER:?ZATCA_DB_USER must be set}
      DB_PASS: ${ZATCA_DB_PASSWORD:?ZATCA_DB_PASSWORD must be set}
      DB_HOST: ${MYSQL_HOST:-host.docker.internal}
      DB_PORT: ${MYSQL_PORT:-3306}
      MASTER_DB: ${MYSQL_MASTER_DB:-zatca_master}

      # Optional elevated account used only by onboarding.
      ADMIN_DB_USER: ${ZATCA_ADMIN_DB_USER:-}
      ADMIN_DB_PASS: ${ZATCA_ADMIN_DB_PASSWORD:-}
      ADMIN_DB_HOST: ${ZATCA_ADMIN_DB_HOST:-}

      # Required by the T008 daemon runtime.
      ENCRYPT_KEY: ${ZATCA_ENCRYPT_KEY:?ZATCA_ENCRYPT_KEY must be set}
      MONITOR_PASS: ${ZATCA_MONITOR_PASSWORD:?ZATCA_MONITOR_PASSWORD must be set}

      # Optional failure-alert delivery.
      SMTP_HOST: ${ZATCA_SMTP_HOST:-host.docker.internal}
      SMTP_PORT: ${ZATCA_SMTP_PORT:-25}
      SMTP_USER: ${ZATCA_SMTP_USER:-}
      SMTP_PASS: ${ZATCA_SMTP_PASSWORD:-}
      SMTP_FROM: ${ZATCA_SMTP_FROM:-}
    command:
      - "--nats-data=/data/nats"
      - "--nats-monitor=8222"
    healthcheck:
      # The T008 daemon protects the NATS monitor with MONITOR_PASS and
      # exposes the NATS readiness endpoint at /healthz.
      test:
        - CMD-SHELL
        - 'wget -qO- --user=health --password="$${MONITOR_PASS}" http://127.0.0.1:8222/healthz >/dev/null'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
