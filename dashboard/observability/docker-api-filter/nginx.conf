events {}

http {
  upstream docker_api {
    server docker-socket-proxy:2375;
  }

  server {
    listen 2375;
    server_name _;
    access_log off;

    # Alloy only needs read-only Docker API calls.
    if ($request_method != GET) {
      return 403;
    }

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header Connection "";

    location ~ ^/(v[0-9]+(?:\.[0-9]+)?/)?(?:_ping|version)$ {
      proxy_pass http://docker_api;
    }

    location ~ ^/(v[0-9]+(?:\.[0-9]+)?/)?events$ {
      proxy_pass http://docker_api;
    }

    location ~ ^/(v[0-9]+(?:\.[0-9]+)?/)?containers/json$ {
      proxy_pass http://docker_api;
    }

    location ~ ^/(v[0-9]+(?:\.[0-9]+)?/)?containers/[A-Za-z0-9_.-]+/logs$ {
      proxy_pass http://docker_api;
    }

    location ~ ^/(v[0-9]+(?:\.[0-9]+)?/)?containers/[A-Za-z0-9_.-]+/(?:json|archive|attach|exec)$ {
      return 403;
    }

    location / {
      return 403;
    }
  }
}
